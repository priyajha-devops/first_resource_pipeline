name: Terraform CI/CD

on:
  push:
    branches:
      - main
      - features

permissions:
  id-token: write
  contents: read

jobs:

  # ------------------------------------------------------------------
  # JOB 1: Runs when code is pushed to "features" branch
  # -> fmt, init, validate, plan
  # ------------------------------------------------------------------
  plan:
    name: Terraform Plan (features branch)
    if: github.ref == 'refs/heads/features' && github.event_name == 'push'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environment/dev

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

  # ------------------------------------------------------------------
  # JOB 2: Runs when code is pushed/merged to "main" branch
  # -> waits for manual approval (GitHub Environment), then applies
  # ------------------------------------------------------------------
  apply:
    name: Terraform Apply (main branch)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production   # <-- add "Required reviewers" to this environment in repo Settings

    defaults:
      run:
        working-directory: environment/dev

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan