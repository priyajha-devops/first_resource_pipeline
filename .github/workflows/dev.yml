
```yaml
name: "Terraform Azure Dev Pipeline"

on:
  push:
    branches:
      - 'feature*'
      - 'feature/**'
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: "Terraform Workflow"
    runs-on: ubuntu-latest

    env:
    
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}


    defaults:
      run:
        working-directory: ./environment/dev

    steps:

      # Step 1: Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4


      # Step 2: Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0
          terraform_wrapper: false


      # Step 3: Login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # Step 4: Verify Azure Login
      - name: Check Azure Account
        run: az account show


      # Step 5: Terraform Init
      - name: Terraform Init
        run: terraform init


      # Step 6: Terraform Format Check
      - name: Terraform Format Check
        run: terraform fmt -check


      # Step 7: Terraform Validate
      - name: Terraform Validate
        run: terraform validate


      # Step 8: Terraform Plan
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color


      # Step 9: Terraform Apply
      # Only main branch par chalega
      - name: Terraform Apply
        id: apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve


      # Step 10: Destroy if Apply Fails
      # Sirf main branch par aur Apply fail hone par
      - name: Terraform Auto-Destroy on Failure
        if: failure() && steps.apply.outcome == 'failure' && github.ref == 'refs/heads/main'
        run: terraform destroy -auto-approve
```
